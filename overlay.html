<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https://i.scdn.co https://*.scdn.co https://mosaic.scdn.co https://image-cdn-ak.spotifycdn.com https://*.spotifycdn.com https://misc.scdn.co; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Spotify Overlay</title>
<style>
  :root { --bg: rgba(12, 14, 20, .94); --line: rgba(255,255,255,.08); --text: #f2f3f5; --dim: #9aa1a8; --green: #1ed760; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; height: 100%; font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; color: var(--text); user-select: none; }
  .panel { position: absolute; inset: 6px 6px 10px; display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
    transform: translateY(-115%); opacity: 0; transition: transform 180ms cubic-bezier(.2,0,0,1), opacity 180ms ease-out; }
  .panel.in { transform: translateY(0); opacity: 1; }
  .panel.out { transform: translateY(-115%); opacity: 0; transition: transform 140ms cubic-bezier(.3,0,1,1), opacity 140ms ease-in; }

  .lists { width: 210px; flex: none; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  .no-lists .lists { display: none; }
  .lists h3 { font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); padding: 10px 12px 6px; }
  .scroll { overflow-y: auto; flex: 1; padding: 0 6px 8px; }
  .scroll::-webkit-scrollbar { width: 4px; } .scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 4px; }
  .pl { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 8px; cursor: pointer; font-size: 12.5px; color: #dfe2e5; }
  .pl:hover { background: rgba(255,255,255,.07); }
  .pl:active { transform: scale(.98); }
  .pl img, .pl .ph { width: 26px; height: 26px; border-radius: 5px; object-fit: cover; flex: none; background: #2a2d31; }
  .pl .liked { background: linear-gradient(135deg, #4b2bd6, #8fd3ff); display: grid; place-items: center; }
  .pl .liked svg { width: 14px; height: 14px; fill: #fff; }
  .pl span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .connect { margin: 8px 10px; font-size: 12px; color: var(--dim); line-height: 1.4; }

  .now { flex: 1; display: flex; align-items: center; gap: 16px; padding: 14px 18px; min-width: 0; }
  .art { width: 112px; height: 112px; border-radius: 10px; flex: none; background: #22252a center/cover no-repeat; }
  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .title { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #wave { width: 100%; height: 34px; display: block; }
  .bar { position: relative; height: 5px; border-radius: 3px; background: rgba(255,255,255,.12); cursor: pointer; margin-top: 2px; }
  .bar:hover { height: 7px; margin-top: 1px; }
  .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 3px; background: var(--green); }
  .times { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .times .left { color: var(--text); font-weight: 600; }
  .controls { display: flex; align-items: center; gap: 10px; }
  button { background: none; border: none; color: var(--text); cursor: pointer; border-radius: 50%; display: grid; place-items: center; transition: transform 100ms ease-out, background 120ms; }
  button:hover { background: rgba(255,255,255,.09); }
  button:active { transform: scale(.92); }
  .sm { width: 34px; height: 34px; } .sm svg { width: 18px; height: 18px; }
  .big { width: 42px; height: 42px; background: var(--text); color: #111; } .big:hover { background: #fff; } .big svg { width: 20px; height: 20px; }
  .gear { width: 30px; height: 30px; margin-left: auto; color: var(--dim); } .gear:hover { color: var(--text); } .gear svg { width: 17px; height: 17px; }
  .key { font-size: 11px; color: var(--dim); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; }
  .vol { display: flex; align-items: center; gap: 6px; color: var(--dim); margin-left: 6px; }
  .vol svg { width: 17px; height: 17px; flex: none; }
  .vol input { width: 92px; accent-color: #8f7bff; height: 4px; cursor: pointer; }
  .mic.rec { background: rgba(143,123,255,.25); color: #c9bfff; animation: pulse 1s ease-in-out infinite; }
  .mic.busy { color: #8fd3ff; }
  .no-voice .mic { display: none; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(143,123,255,.18); } }
  .status { position: absolute; left: 228px; right: 190px; bottom: 6px; font-size: 11.5px; color: #c9bfff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity 150ms; }
  .status.on { opacity: 1; }
  .no-lists .status { left: 18px; }
  .viz { width: 176px; flex: none; display: grid; place-items: center; border-left: 1px solid var(--line); }
  #globe { width: 166px; height: 166px; display: block; }
</style>
</head>
<body>
<div class="panel" id="panel">
  <div class="lists">
    <h3>Playlists</h3>
    <div class="scroll" id="lists"><div class="connect" id="connectNote">Connect Spotify in Settings (gear button) to see your playlists here.</div></div>
  </div>
  <div class="now">
    <div class="art" id="art"></div>
    <div class="info">
      <div class="title" id="title">Nothing playing</div>
      <div class="artist" id="artist">Open Spotify and press play</div>
      <canvas id="wave"></canvas>
      <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
      <div class="times"><span id="pos">0:00</span><span class="left" id="left">-0:00</span></div>
      <div class="controls">
        <button class="sm" id="prev" title="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>
        <button class="big" id="play" title="Play / pause"><svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="sm" id="next" title="Skip"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
        <div class="vol" title="Spotify volume"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg><input type="range" id="vol" min="0" max="1" step="0.01" value="1"></div>
        <button class="sm mic" id="mic" title="Hey Claude: click, say what to play, click again (or wait)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-2.1A7 7 0 0 0 19 12h-2z"/></svg></button>
        <button class="gear" id="gear" title="Settings"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.5 7.5 0 0 0-1.7-1L15 3.3h-4l-.3 2.6a7.5 7.5 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.3 2.6h4l.3-2.6c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button>
        <span class="key" id="key">F8 to hide</span>
      </div>
    </div>
  </div>
  <div class="viz"><canvas id="globe"></canvas></div>
  <div class="status" id="status"></div>
</div>
<script src="globe.js"></script>
<script>
  const $ = (id) => document.getElementById(id), panel = $('panel');
  const PLAY = '<path d="M8 5v14l11-7z"/>', PAUSE = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
  const HEART = '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.3 3.2 4.5 6.9 4.5c2.1 0 3.6 1.1 5.1 3 1.5-1.9 3-3 5.1-3 3.7 0 6 3.8 4.5 7.3C19.5 16.4 12 21 12 21z"/></svg>';
  const fmt = (s) => { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  let st = null, stAt = 0, hideTimer = null, autoHide = 8, hovering = false, raf = 0, lastDraw = 0;

  function render() {
    if (!st || !st.active) { $('title').textContent = 'Nothing playing'; $('artist').textContent = 'Open Spotify and press play'; $('fill').style.width = '0'; $('pos').textContent = '0:00'; $('left').textContent = '-0:00'; return; }
    const pos = Math.min(st.duration, st.position + (st.playing ? (performance.now() - stAt) / 1000 : 0));
    $('fill').style.width = (st.duration ? pos / st.duration * 100 : 0) + '%';
    $('pos').textContent = fmt(pos); $('left').textContent = '-' + fmt(st.duration - pos);
  }

  // ---------------------------------------------------------------- music-driven visuals
  const react = window.MusicReact();
  const globe = window.GridGlobe($('globe'), react);
  const wave = $('wave'), wx = wave.getContext('2d'), DPR = Math.min(2, window.devicePixelRatio || 1);
  function fitWave() { const r = wave.getBoundingClientRect(); wave.width = Math.round(r.width * DPR); wave.height = Math.round(r.height * DPR); }
  window.overlay.on('meter', (m) => react.feed(m));

  function drawWave() {
    const W = wave.width, H = wave.height, mid = H / 2, s = react, hue = s.hue;
    wx.clearRect(0, 0, W, H);
    const hist = s.history, n = hist.length, bw = W / n;
    for (let i = 0; i < n; i++) {
      const h = Math.max(1, hist[i] * H * 0.95);
      wx.fillStyle = `hsla(${hue + i * 0.35}, 90%, 60%, ${0.1 + 0.2 * (i / n)})`;
      wx.fillRect(i * bw, mid - h / 2, Math.max(1, bw - DPR), h);
    }
    const amp = (2 + s.level * 16 + s.beat * 6 * s.intensity) * DPR;
    const grad = wx.createLinearGradient(0, 0, W, 0);
    grad.addColorStop(0, `hsl(${hue - 10}, 95%, 66%)`); grad.addColorStop(1, `hsl(${hue + 45}, 95%, 68%)`);
    wx.strokeStyle = grad; wx.lineWidth = (2 + s.beat) * DPR; wx.beginPath();
    for (let x = 0; x <= W; x += 3 * DPR) {
      const u = x / W, env = Math.sin(u * Math.PI);
      const y = mid + env * amp * (Math.sin(u * 22 + s.phase) * 0.6 + Math.sin(u * 47 - s.phase * 1.7) * 0.3 + Math.sin(u * 93 + s.phase * 2.3) * 0.15 * (0.5 + s.energy));
      x ? wx.lineTo(x, y) : wx.moveTo(x, y);
    }
    wx.stroke();
  }
  function loop(t) {
    raf = requestAnimationFrame(loop);
    render();
    if (t - lastDraw < 32) return;            // ~30 fps keeps the GPU free for the game
    lastDraw = t; react.step(); globe.draw(t); drawWave();
  }
  requestAnimationFrame(() => { globe.fit(); fitWave(); });
  function armHide() { clearTimeout(hideTimer); if (autoHide > 0 && !hovering) hideTimer = setTimeout(() => window.overlay.hide(), autoHide * 1000); }

  // ---------------------------------------------------------------- data from the app
  window.overlay.on('state', (s) => {
    st = s; stAt = performance.now();
    if (s.active) {
      $('title').textContent = s.title || 'Unknown'; $('artist').textContent = s.artist || '';
      $('playIcon').innerHTML = s.playing ? PAUSE : PLAY;
      $('art').style.backgroundImage = s.art ? `url("${s.art}")` : 'none';
    }
    const note = $('connectNote'); if (s.connected && note) note.style.display = 'none';   // gone once playlists are listed
    render();
  });
  window.overlay.on('playlists', (items) => {
    const box = $('lists'); box.innerHTML = '';
    if (!items.length) { box.innerHTML = '<div class="connect">No playlists found.</div>'; return; }
    for (const p of items) {
      const row = document.createElement('div'); row.className = 'pl'; row.title = p.name;
      let img;
      if (p.liked) { img = document.createElement('div'); img.className = 'ph liked'; img.innerHTML = HEART; }
      else img = p.image ? Object.assign(document.createElement('img'), { src: p.image }) : Object.assign(document.createElement('div'), { className: 'ph' });
      const name = document.createElement('span'); name.textContent = p.name;
      row.append(img, name); row.onclick = () => { window.overlay.playPlaylist(p.uri); armHide(); };
      box.appendChild(row);
    }
  });
  window.overlay.on('show', (o) => {
    autoHide = o.autoHide; react.intensity = o.intensity || 1;
    document.body.classList.toggle('no-lists', o.showPlaylists === false);
    $('key').textContent = (o.hotkey || 'F8') + ' to hide';
    panel.classList.remove('out'); requestAnimationFrame(() => { panel.classList.add('in'); globe.fit(); fitWave(); });
    cancelAnimationFrame(raf); raf = requestAnimationFrame(loop); armHide();
  });
  window.overlay.on('hide', () => { panel.classList.remove('in'); panel.classList.add('out'); clearTimeout(hideTimer); setTimeout(() => cancelAnimationFrame(raf), 180); });

  panel.addEventListener('mouseenter', () => { hovering = true; clearTimeout(hideTimer); });
  panel.addEventListener('mouseleave', () => { hovering = false; armHide(); });
  $('prev').onclick = () => window.overlay.cmd('prev');
  $('next').onclick = () => window.overlay.cmd('next');
  $('play').onclick = () => { if (st) { st.playing = !st.playing; $('playIcon').innerHTML = st.playing ? PAUSE : PLAY; } window.overlay.cmd('toggle'); };
  $('gear').onclick = () => window.overlay.settings();
  $('bar').onclick = (e) => { if (!st || !st.duration) return; const r = e.currentTarget.getBoundingClientRect(); window.overlay.seek((e.clientX - r.left) / r.width * st.duration); };
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.overlay.hide(); });

  // ---------------------------------------------------------------- volume (Spotify's own mixer level)
  let volDragging = false;
  $('vol').addEventListener('input', (e) => { volDragging = true; window.overlay.volume(+e.target.value); });
  $('vol').addEventListener('change', () => { volDragging = false; });
  window.overlay.on('volume', (v) => { if (!volDragging && v >= 0) $('vol').value = v; });

  // ---------------------------------------------------------------- "Hey Claude" voice button
  // Click: records up to 6 s (click again to stop early). Audio stays on this PC; only the words go to Claude.
  let rec = null, chunks = [], statusTimer = null;
  function status(text, sticky) {
    const el = $('status'); el.textContent = text; el.classList.add('on'); clearTimeout(statusTimer);
    if (!sticky) statusTimer = setTimeout(() => el.classList.remove('on'), 5000);
  }
  window.overlay.on('voice-status', (s) => { const done = /^(Playing|Couldn|Didn|Connect|Voice error)/.test(s); status(s, !done); if (done) $('mic').classList.remove('busy'); });
  $('mic').onclick = async () => {
    if (rec && rec.state === 'recording') { rec.stop(); return; }
    if ($('mic').classList.contains('busy')) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
      chunks = []; rec = new MediaRecorder(stream, { mimeType: 'audio/webm' });
      rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
      rec.onstop = async () => {
        stream.getTracks().forEach((t) => t.stop());           // mic off the moment recording ends
        $('mic').classList.remove('rec'); $('mic').classList.add('busy');
        const buf = new Uint8Array(await new Blob(chunks, { type: 'audio/webm' }).arrayBuffer());
        status('Working...', true); window.overlay.voice(buf);
      };
      rec.start(); $('mic').classList.add('rec'); status('Listening... say what to play', true);
      clearTimeout(hideTimer); hovering = true;
      setTimeout(() => { if (rec && rec.state === 'recording') rec.stop(); }, 6000);
    } catch (e) { status('Microphone unavailable: ' + e.message); }
  };
  window.overlay.on('show', (o) => document.body.classList.toggle('no-voice', o.voice === false));
</script>
</body>
</html>
